name: "Docker"

on:
  workflow_dispatch:

  push:
    branches: ["master"]

  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  test:
    name: "Test"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Build"
        run: make build

      - name: "Test"
        run: make test

  build:
    name: "Build"
    needs: ["test"]
    uses: dockette/.github/.github/workflows/docker.yml@master
    secrets: inherit
    with:
      image: "dockette/flyio"
      tag: "${{ matrix.tag }}"
      context: "${{ matrix.context }}"
    strategy:
      matrix:
        include:
          - { context: flyio, tag: latest }

  docs:
    name: "Docs"
    needs: ["build"]
    if: github.ref == 'refs/heads/master'
    uses: dockette/.github/.github/workflows/dockerhub-description.yml@master
    secrets: inherit
    with:
      image: "dockette/flyio"
